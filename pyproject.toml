[project]
name = "legal-ai-platform"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pygments>=2.20.0",
    "ruff>=0.15.14",
    "pytest>=8.3",
    # Тестовый клиент FastAPI/Starlette: связка с httpx устарела (Starlette
    # предупреждает на каждом прогоне), замена — httpx2.
    "httpx2>=2.13",
]

[tool.uv.workspace]
members = [
    "apps/contract-worker",
    "apps/core-api",
    "apps/lead-bot",
    "apps/news",
    "apps/web",
    "packages/prompts",
    "packages/shared",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "apps/web",
    "apps/lead-bot/legacy",
    "apps/news/legacy",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["apps/core-api", "apps/contract-worker", "apps/news", "packages/shared", "packages/prompts"]
addopts = "-q"
