name: 🚀 Deploy to VDS

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v3

      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧪 Run tests
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ADMIN_TELEGRAM_ID: ${{ secrets.ADMIN_TELEGRAM_ID }}
        run: |
          pytest tests/ -v --tb=short

  deploy:
    name: Deploy AI Verdict Bot
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v3

      - name: 🔐 Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USERNAME }}
          key: ${{ secrets.VDS_SSH_PRIVATE_KEY }}
          port: ${{ secrets.VDS_PORT || 22 }}
          script: |
            cd /opt/legal-ai-bot
            bash deploy.sh

      - name: 🔍 Health Check
        run: |
          echo "⏳ Waiting 10 seconds for bot to start..."
          sleep 10

          echo "🔍 Checking bot status via Telegram API..."
          response=$(curl -s "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/getMe")

          if echo "$response" | grep -q '"ok":true'; then
            echo "✅ Bot is running and responding!"
            echo "$response" | jq '.result.username'
          else
            echo "❌ Bot health check failed!"
            echo "$response"
            exit 1
          fi

      - name: ✅ Deployment notification
        run: echo "✅ Bot deployed successfully to VDS!"

