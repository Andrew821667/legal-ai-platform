name: CI/CD

on:
  push:
    branches: [main, codex/**]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv sync
      - run: uv run ruff check apps/ packages/ --select F,B904,B905,UP031

  test-core-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: legalai
          POSTGRES_USER: legalai
          POSTGRES_PASSWORD: legalai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U legalai -d legalai"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://legalai:legalai@localhost:5432/legalai
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv sync
      - run: uv run --package core-api --with httpx --directory apps/core-api alembic upgrade head
      - run: uv run --package core-api --with httpx pytest apps/core-api/tests/ -q

  test-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv sync
      - run: uv run --package news pytest apps/news/tests/ -q

  test-lead-bot-legacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv sync
      - run: python3 -m venv .venv-legacy
      - run: .venv-legacy/bin/pip install -r apps/lead-bot/legacy/requirements.txt
      - run: >-
          cd apps/lead-bot/legacy &&
          TELEGRAM_BOT_TOKEN=123456:ABCDEFghijklmnopqrstuvwxyz
          OPENAI_API_KEY=sk-test-key
          ADMIN_TELEGRAM_ID=1
          CORE_API_SYNC_ENABLED=0
          ../../../.venv-legacy/bin/python -m pytest tests -q

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --prefix apps/web
      - run: npm run build --prefix apps/web

  web-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --prefix apps/web
      - run: npm run lint --prefix apps/web

  contract-ai-entrypoint-smoke:
    if: ${{ vars.CONTRACT_AI_SYSTEM_SMOKE_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check external Contract_AI_System entrypoint
        env:
          CONTRACT_AI_SYSTEM_SMOKE_URL: ${{ vars.CONTRACT_AI_SYSTEM_SMOKE_URL }}
          CONTRACT_AI_SYSTEM_EXPECTED_MARKER: ${{ vars.CONTRACT_AI_SYSTEM_EXPECTED_MARKER }}
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          http_code="$(curl -L -sS -o "$response_file" -w '%{http_code}' "$CONTRACT_AI_SYSTEM_SMOKE_URL")"
          case "$http_code" in
            200|201|202|204)
              ;;
            *)
              echo "Unexpected status from Contract_AI_System entrypoint: $http_code"
              cat "$response_file"
              exit 1
              ;;
          esac
          if [ -n "${CONTRACT_AI_SYSTEM_EXPECTED_MARKER:-}" ]; then
            grep -Fq "$CONTRACT_AI_SYSTEM_EXPECTED_MARKER" "$response_file"
          fi

  # Contract_AI_System is maintained in a separate repository and validated there.
  build-and-push:
    needs:
      [
        lint,
        test-core-api,
        test-news,
        test-lead-bot-legacy,
        web-build,
        web-lint,
      ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image_name: core-api
            dockerfile: apps/core-api/Dockerfile
          - image_name: lead-bot
            dockerfile: apps/lead-bot/legacy/Dockerfile
          - image_name: web
            dockerfile: apps/web/Dockerfile
          - image_name: news
            dockerfile: apps/news/Dockerfile
          - image_name: news-reader
            dockerfile: apps/news/legacy/Dockerfile.reader
    steps:
      - uses: actions/checkout@v6
      - id: image_owner
        run: echo "value=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ steps.image_owner.outputs.value }}/legal-ai-${{ matrix.image_name }}:latest
            ghcr.io/${{ steps.image_owner.outputs.value }}/legal-ai-${{ matrix.image_name }}:${{ github.sha }}

  deploy-macmini:
    needs: [build-and-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_MACMINI_DEPLOY == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6

      - uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Sync deploy files
        env:
          MACMINI_HOST: ${{ vars.MACMINI_TAILSCALE_HOST }}
        run: |
          set -euo pipefail
          : "${MACMINI_HOST:?Set MACMINI_TAILSCALE_HOST, for example 100.78.58.52}"
          ssh -o StrictHostKeyChecking=accept-new legalai@"$MACMINI_HOST" \
            "cd /Users/legalai/projects/legal-ai-platform && git pull --ff-only origin main"

      - id: image_owner
        run: echo "value=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Deploy on Mac Mini
        env:
          MACMINI_HOST: ${{ vars.MACMINI_TAILSCALE_HOST }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
          IMAGE_OWNER: ${{ steps.image_owner.outputs.value }}
          CORE_API_IMAGE: ghcr.io/${{ steps.image_owner.outputs.value }}/legal-ai-core-api:${{ github.sha }}
          WEB_IMAGE: ghcr.io/${{ steps.image_owner.outputs.value }}/legal-ai-web:${{ github.sha }}
          LEAD_BOT_IMAGE: ghcr.io/${{ steps.image_owner.outputs.value }}/legal-ai-lead-bot:${{ github.sha }}
          NEWS_IMAGE: ghcr.io/${{ steps.image_owner.outputs.value }}/legal-ai-news:${{ github.sha }}
          NEWS_READER_IMAGE: ghcr.io/${{ steps.image_owner.outputs.value }}/legal-ai-news-reader:${{ github.sha }}
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new andrej@"$MACMINI_HOST" \
            "GHCR_USERNAME='$GHCR_USERNAME' GHCR_TOKEN='$GHCR_TOKEN' CORE_API_IMAGE='$CORE_API_IMAGE' WEB_IMAGE='$WEB_IMAGE' LEAD_BOT_IMAGE='$LEAD_BOT_IMAGE' NEWS_IMAGE='$NEWS_IMAGE' NEWS_READER_IMAGE='$NEWS_READER_IMAGE' APP_DIR=/Users/legalai/projects/legal-ai-platform /Users/legalai/projects/legal-ai-platform/infra/scripts/deploy_macmini.sh"
