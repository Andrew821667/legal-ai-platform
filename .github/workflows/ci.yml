name: CI/CD

on:
  push:
    branches: [main, codex/**]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - run: uv run ruff check apps/ packages/ --select F,B904,B905,UP031

  test-core-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: legalai
          POSTGRES_USER: legalai
          POSTGRES_PASSWORD: legalai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U legalai -d legalai"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://legalai:legalai@localhost:5432/legalai
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - run: uv run --package core-api --with httpx --directory apps/core-api alembic upgrade head
      - run: uv run --package core-api --with httpx pytest apps/core-api/tests/ -q

  test-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - run: uv run --package news pytest apps/news/tests/ -q

  test-lead-bot-legacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - run: python3 -m venv .venv-legacy
      - run: .venv-legacy/bin/pip install -r apps/lead-bot/legacy/requirements.txt
      - run: >-
          cd apps/lead-bot/legacy &&
          TELEGRAM_BOT_TOKEN=123456:ABCDEFghijklmnopqrstuvwxyz
          OPENAI_API_KEY=sk-test-key
          ADMIN_TELEGRAM_ID=1
          CORE_API_SYNC_ENABLED=0
          ../../../.venv-legacy/bin/python -m pytest tests -q

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --prefix apps/web
      - run: npm run build --prefix apps/web

  web-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --prefix apps/web
      - run: npm run lint --prefix apps/web

  contract-ai-backend-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r apps/contract-ai/requirements_minimal.txt pytest
      - run: cd apps/contract-ai && PYTHONPATH=. pytest tests/test_rate_limiter.py -q
      - run: cd apps/contract-ai && PYTHONPATH=. python -m compileall src config database

  contract-ai-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/contract-ai/frontend/package-lock.json
      - run: npm ci --prefix apps/contract-ai/frontend
      - run: npm run type-check --prefix apps/contract-ai/frontend
      - run: npm run build --prefix apps/contract-ai/frontend

  build-and-push:
    needs:
      [
        lint,
        test-core-api,
        test-news,
        test-lead-bot-legacy,
        web-build,
        web-lint,
        contract-ai-backend-smoke,
        contract-ai-frontend,
      ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image_name: core-api
            dockerfile: apps/core-api/Dockerfile
          - image_name: lead-bot
            dockerfile: apps/lead-bot/legacy/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - id: image_owner
        run: echo "value=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ steps.image_owner.outputs.value }}/legal-ai-${{ matrix.image_name }}:latest
            ghcr.io/${{ steps.image_owner.outputs.value }}/legal-ai-${{ matrix.image_name }}:${{ github.sha }}
