name: CI/CD

on:
  push:
    branches: [main, codex/**]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/legal-ai

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - run: uv run ruff check apps/ packages/ --select F,B904,B905,UP031

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - suite: core-api
            package: core-api
            path: apps/core-api/tests/
          - suite: news
            package: news
            path: apps/news/tests/
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - run: uv run --package ${{ matrix.package }} pytest ${{ matrix.path }} -q

  test-lead-bot-legacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - run: python3 -m venv .venv-legacy
      - run: .venv-legacy/bin/pip install -r apps/lead-bot/legacy/requirements.txt
      - run: >-
          cd apps/lead-bot/legacy &&
          TELEGRAM_BOT_TOKEN=123456:ABCDEFghijklmnopqrstuvwxyz
          OPENAI_API_KEY=sk-test-key
          ADMIN_TELEGRAM_ID=1
          CORE_API_SYNC_ENABLED=0
          ../../.venv-legacy/bin/python -m pytest tests -q

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --prefix apps/web
      - run: npm run build --prefix apps/web

  web-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --prefix apps/web
      - run: npm run lint --prefix apps/web

  build-and-push:
    needs: [lint, test, test-lead-bot-legacy, web-build, web-lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image_name: core-api
            dockerfile: apps/core-api/Dockerfile
          - image_name: lead-bot
            dockerfile: apps/lead-bot/legacy/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-${{ matrix.image_name }}:latest
