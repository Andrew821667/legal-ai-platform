version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    open-pull-requests-limit: 2
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Moscow"
    labels:
      - "dependencies"
      - "security"

  - package-ecosystem: "npm"
    directory: "/apps/web"
    open-pull-requests-limit: 2
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:15"
      timezone: "Europe/Moscow"
    labels:
      - "dependencies"
      - "security"
    groups:
      web-runtime:
        dependency-type: "production"
        update-types:
          - "patch"
          - "minor"

  - package-ecosystem: "pip"
    directory: "/"
    open-pull-requests-limit: 2
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "Europe/Moscow"
    labels:
      - "dependencies"
      - "security"

  - package-ecosystem: "pip"
    directory: "/apps/core-api"
    open-pull-requests-limit: 2
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:35"
      timezone: "Europe/Moscow"
    labels:
      - "dependencies"
      - "security"

  - package-ecosystem: "pip"
    directory: "/apps/news"
    open-pull-requests-limit: 2
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:40"
      timezone: "Europe/Moscow"
    labels:
      - "dependencies"
      - "security"

  - package-ecosystem: "pip"
    directory: "/apps/lead-bot"
    open-pull-requests-limit: 2
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:45"
      timezone: "Europe/Moscow"
    labels:
      - "dependencies"
      - "security"

  - package-ecosystem: "pip"
    directory: "/apps/lead-bot/legacy"
    open-pull-requests-limit: 2
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:50"
      timezone: "Europe/Moscow"
    labels:
      - "dependencies"
      - "security"

  - package-ecosystem: "docker"
    directory: "/apps/web"
    open-pull-requests-limit: 1
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
      timezone: "Europe/Moscow"
    labels:
      - "dependencies"
      - "security"

  - package-ecosystem: "docker"
    directory: "/apps/core-api"
    open-pull-requests-limit: 1
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:05"
      timezone: "Europe/Moscow"
    labels:
      - "dependencies"
      - "security"

  - package-ecosystem: "docker"
    directory: "/apps/lead-bot/legacy"
    open-pull-requests-limit: 1
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:10"
      timezone: "Europe/Moscow"
    labels:
      - "dependencies"
      - "security"

  - package-ecosystem: "docker"
    directory: "/apps/news"
    open-pull-requests-limit: 1
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:15"
      timezone: "Europe/Moscow"
    labels:
      - "dependencies"
      - "security"
