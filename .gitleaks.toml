description = "Known placeholder secrets in examples and docs"
regexes = [
  '''1234567890:ABCdefGHIjklMNOpqrsTUVwxyz''',
  '''123456789:ABCdefGHIjklMNOpqrsTUVwxyz''',
  '''sk-proj-[A-Za-z0-9._-]*\.{3,}''',
