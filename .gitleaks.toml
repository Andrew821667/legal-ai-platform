  '''y0_AgAAAAA\.{3,}''',
  '''your-(?:app-password|bot-token|reader-bot-token|openai-api-key|deepseek-api-key|perplexity-api-key)''',
  '''your_(?:app_password|bot_token|reader_bot_token|openai_api_key|deepseek_api_key|perplexity_api_key|secure_password(?:_here)?|redis_password|secret_key(?:_change_in_production)?|token(?:_here)?|api_key(?:_here)?)''',
]
