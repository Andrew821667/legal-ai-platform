services:
  postgres:
    image: postgres:16-alpine
    container_name: legal-ai-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-legalai_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-legalai_platform}
      TZ: ${TZ:-Europe/Moscow}
    command: >
      postgres
      -c shared_buffers=256MB
      -c work_mem=8MB
      -c maintenance_work_mem=128MB
      -c effective_cache_size=1GB
      -c max_connections=30
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-legalai_app} -d ${POSTGRES_DB:-legalai_platform}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 1g
    memswap_limit: 1g
    restart: unless-stopped
    # Как у остальных: без предела журнал контейнера растёт, пока не съест диск.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  web:
    image: ${WEB_IMAGE:-legal-ai-web:local}
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_CONTRACT_AI_SYSTEM_URL: ${NEXT_PUBLIC_CONTRACT_AI_SYSTEM_URL:-https://contract.ai-verdict.ru}
        NEXT_PUBLIC_CORE_API_URL: ${NEXT_PUBLIC_CORE_API_URL:-https://${DOMAIN}}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://${DOMAIN}}
    container_name: legal-ai-web
    env_file:
      - ../../.env
    environment:
      <<: *secrets-off-web
      CORE_API_URL: ${CORE_API_DOCKER_URL:-http://core-api:8000}
      ASSISTANT_API_URL: ${ASSISTANT_API_DOCKER_URL:-http://assistant-api:8080}
      WEB_ASSISTANT_INTERNAL_KEY: ${WEB_ASSISTANT_INTERNAL_KEY:-}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://${DOMAIN}}
      NEXT_PUBLIC_CONTRACT_AI_SYSTEM_URL: ${NEXT_PUBLIC_CONTRACT_AI_SYSTEM_URL:-https://contract.ai-verdict.ru}
      ADMIN_SECURITY_STORE_PATH: ${ADMIN_SECURITY_STORE_PATH:-/app/data/web-admin-security.json}
      AI_LAW_EDITORIAL_STORE_PATH: ${AI_LAW_EDITORIAL_STORE_PATH:-/app/data/ai-law-comments.json}
      TZ: ${TZ:-Europe/Moscow}
    depends_on:
      core-api:
        condition: service_healthy
      assistant-api:
        condition: service_healthy
    volumes:
      - web_data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
    mem_limit: 384m
    memswap_limit: 384m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  core-api:
    image: ${CORE_API_IMAGE:-legal-ai-core-api:local}
    build:
      context: ../..
      dockerfile: apps/core-api/Dockerfile
    container_name: legal-ai-core-api
    env_file:
      - ../../.env
    environment:
      <<: *secrets-off-core
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-legalai_app}:${POSTGRES_PASSWORD:-change_me_local_only}@postgres:5432/${POSTGRES_DB:-legalai_platform}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://ai-verdict.ru,http://localhost:3000}
      MINIAPP_PUBLIC_BASE_URL: ${MINIAPP_PUBLIC_BASE_URL:-https://ai-verdict.ru}
      CORE_API_WORKERS: ${CORE_API_WORKERS:-4}
      TZ: ${TZ:-Europe/Moscow}
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "api.telegram.org:${TELEGRAM_API_HOST_IP:-149.154.167.220}"
    networks:
      default:
        aliases:
          - legal-ai-core-api
    ports:
      - "${CORE_API_BIND_HOST:-127.0.0.1}:${CORE_API_PUBLISH_PORT:-8000}:8000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').getcode() == 200 else 1)",
        ]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 180s
    mem_limit: 512m
    memswap_limit: 512m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  lead-bot:
    image: ${LEAD_BOT_IMAGE:-legal-ai-lead-bot:local}
    build:
      context: ../..
      dockerfile: apps/lead-bot/legacy/Dockerfile
    container_name: legal-ai-lead-bot
    env_file:
      - ../../.env
    environment:
      <<: *secrets-off-lead-bot
      CORE_API_URL: ${CORE_API_DOCKER_URL:-http://core-api:8000}
      TZ: ${TZ:-Europe/Moscow}
    dns:
      - 1.1.1.1
      - 8.8.8.8
    extra_hosts: *telegram-api-extra-hosts
    depends_on:
      core-api:
        condition: service_healthy
    volumes:
      - lead_bot_data:/app/data
      - lead_bot_logs:/app/logs
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    memswap_limit: 256m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  assistant-api:
    image: ${LEAD_BOT_IMAGE:-legal-ai-lead-bot:local}
    build:
      context: ../..
      dockerfile: apps/lead-bot/legacy/Dockerfile
    container_name: legal-ai-assistant-api
    env_file:
      - ../../.env
    environment:
      <<: *secrets-off-lead-bot
      # Ассистент сайта разбирает текст посетителей — ключ admin, секрет входа
      # юриста и токен бота ему не нужны (код web_assistant_api их не читает,
      # сверка — test_compose_secrets.py). Config бота требует непустой токен,
      # поэтому здесь заглушка: в Telegram ассистент не ходит.
      API_KEY_ADMIN: ""
      API_KEY_NEWS: ""
      LAWYER_SESSION_SECRET: ""
      TELEGRAM_BOT_TOKEN: ""
      LEAD_BOT_TOKEN: "0:assistant-api-without-telegram"
      DB_PATH: /tmp/web-assistant.db
      LOG_FILE: /tmp/web-assistant.log
      CORE_API_SYNC_ENABLED: "0"
      WEB_ASSISTANT_INTERNAL_KEY: ${WEB_ASSISTANT_INTERNAL_KEY:-}
      TZ: ${TZ:-Europe/Moscow}
    command: ["python", "-m", "uvicorn", "web_assistant_api:app", "--host", "0.0.0.0", "--port", "8080"]
    user: "appuser:appgroup"
    expose:
      - "8080"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health').getcode() == 200 else 1)"]
      interval: 20s
      timeout: 5s
      retries: 5
    mem_limit: 192m
    memswap_limit: 192m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  news-generate:
    image: ${NEWS_IMAGE:-compose-news:latest}
    build:
      context: ../..
      dockerfile: apps/news/Dockerfile
    container_name: legal-ai-news-generate
    env_file:
      - ../../.env
    environment:
      <<: *secrets-off-news
      API_KEY_ADMIN: ""  # ключ admin нужен только news-admin-bot
      CORE_API_URL: ${CORE_API_DOCKER_URL:-http://core-api:8000}
      TELEGRAM_SESSION_NAME: ${TELEGRAM_SESSION_NAME_DOCKER:-/app/data/telegram_bot}
      NEWS_TELEGRAM_CACHE_PATH: ${NEWS_TELEGRAM_CACHE_PATH:-/app/data/news_telegram_cache.json}
      TZ: ${TZ:-Europe/Moscow}
    command: >
      uv run --package news python -m news.generate_loop
    extra_hosts: *telegram-api-extra-hosts
    depends_on:
      core-api:
        condition: service_healthy
    volumes:
      - ../../data:/app/data
    mem_limit: 384m
    memswap_limit: 384m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  news-telegram-ingest:
    image: ${NEWS_IMAGE:-compose-news:latest}
    build:
      context: ../..
      dockerfile: apps/news/Dockerfile
    container_name: legal-ai-news-telegram-ingest
    env_file:
      - ../../.env
    environment:
      <<: *secrets-off-news
      API_KEY_ADMIN: ""  # ключ admin нужен только news-admin-bot
      CORE_API_URL: ${CORE_API_DOCKER_URL:-http://core-api:8000}
      TELEGRAM_SESSION_NAME: ${TELEGRAM_SESSION_NAME_DOCKER:-/app/data/telegram_bot}
      NEWS_TELEGRAM_CACHE_PATH: ${NEWS_TELEGRAM_CACHE_PATH:-/app/data/news_telegram_cache.json}
      TZ: ${TZ:-Europe/Moscow}
    command: >
      uv run --package news python -m news.telegram_ingest_loop
    extra_hosts: *telegram-api-and-host-extra-hosts
    depends_on:
      core-api:
        condition: service_healthy
    volumes:
      - ../../data:/app/data
    mem_limit: 320m
    memswap_limit: 320m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  news-publish:
    image: ${NEWS_IMAGE:-compose-news:latest}
    build:
      context: ../..
      dockerfile: apps/news/Dockerfile
    container_name: legal-ai-news-publish
    env_file:
      - ../../.env
    environment:
      <<: *secrets-off-news
      API_KEY_ADMIN: ""  # ключ admin нужен только news-admin-bot
      CORE_API_URL: ${CORE_API_DOCKER_URL:-http://core-api:8000}
      TZ: ${TZ:-Europe/Moscow}
    command: >
      uv run --package news python -m news.publish_loop
    extra_hosts: *telegram-api-extra-hosts
    depends_on:
      core-api:
        condition: service_healthy
    mem_limit: 256m
    memswap_limit: 256m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  news-admin-bot:
    image: ${NEWS_IMAGE:-compose-news:latest}
    build:
      context: ../..
      dockerfile: apps/news/Dockerfile
    container_name: legal-ai-news-admin-bot
    env_file:
      - ../../.env
    environment:
      <<: *secrets-off-news
      CORE_API_URL: ${CORE_API_DOCKER_URL:-http://core-api:8000}
      TZ: ${TZ:-Europe/Moscow}
    command: ["uv", "run", "python", "-m", "news.admin_bot"]
    extra_hosts: *telegram-api-extra-hosts
    depends_on:
      core-api:
        condition: service_healthy
    mem_limit: 256m
    memswap_limit: 256m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  news-reader-bot:
    image: ${NEWS_READER_IMAGE:-compose-news-reader:latest}
    build:
      context: ../..
      dockerfile: apps/news/legacy/Dockerfile.reader
    container_name: legal-ai-news-reader-bot
    env_file:
      - ../../.env
    environment:
      <<: *secrets-off-reader
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-legalai_app}:${POSTGRES_PASSWORD:-change_me_local_only}@postgres:5432/${POSTGRES_DB:-legalai_platform}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-legalai_platform}
      POSTGRES_USER: ${POSTGRES_USER:-legalai_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local_only}
      READER_BOT_USERNAME: ${READER_BOT_USERNAME:-legal_ai_news_reader_bot}
      NEWS_HELPER_BOT_USERNAME: ${NEWS_HELPER_BOT_USERNAME:-legal_ai_helper_new_bot}
      CORE_API_URL: ${CORE_API_DOCKER_URL:-http://core-api:8000}
      TZ: ${TZ:-Europe/Moscow}
    command: ["python", "-u", "-m", "app.reader_bot"]
    extra_hosts: *telegram-api-extra-hosts
    depends_on:
      postgres:
        condition: service_healthy
      core-api:
        condition: service_healthy
    mem_limit: 384m
    memswap_limit: 384m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  news-reader-digest:
    image: ${NEWS_READER_IMAGE:-compose-news-reader:latest}
    build:
      context: ../..
      dockerfile: apps/news/legacy/Dockerfile.reader
    container_name: legal-ai-news-reader-digest
    env_file:
      - ../../.env
    environment:
      <<: *secrets-off-reader
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-legalai_app}:${POSTGRES_PASSWORD:-change_me_local_only}@postgres:5432/${POSTGRES_DB:-legalai_platform}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-legalai_platform}
      POSTGRES_USER: ${POSTGRES_USER:-legalai_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local_only}
      READER_BOT_USERNAME: ${READER_BOT_USERNAME:-legal_ai_news_reader_bot}
      NEWS_HELPER_BOT_USERNAME: ${NEWS_HELPER_BOT_USERNAME:-legal_ai_helper_new_bot}
      CORE_API_URL: ${CORE_API_DOCKER_URL:-http://core-api:8000}
      TZ: ${TZ:-Europe/Moscow}
    command: ["python", "-u", "-m", "app.reader_digest_loop"]
    depends_on:
      postgres:
        condition: service_healthy
      core-api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json, os, sys, urllib.request; key=os.getenv('API_KEY_NEWS') or ''; base=(os.getenv('CORE_API_URL') or 'http://core-api:8000').rstrip('/'); req=urllib.request.Request(base + '/api/v1/workers/status', headers={'X-API-Key': key} if key else {}); data=json.loads(urllib.request.urlopen(req, timeout=8).read().decode()); rows=[row for row in data.get('workers', []) if row.get('worker_id') == 'news-reader-digest']; ok=bool(rows and rows[0].get('active')); sys.exit(0 if ok else 1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    mem_limit: 320m
    memswap_limit: 320m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  caddy:
    image: ${CADDY_IMAGE:-legal-ai-caddy:local}
    build:
      context: ../..
      dockerfile: infra/caddy/Dockerfile.public
    container_name: legal-ai-caddy
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
      - "127.0.0.1:${CADDY_LOCAL_HTTP_PORT:-8088}:8088"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN}
      MONITOR_DOMAIN: ${MONITOR_DOMAIN:-monitor.ai-verdict.ru}
      MEMORY_DOMAIN: ${MEMORY_DOMAIN:-memory.ai-verdict.ru}
      ACME_EMAIL: ${ACME_EMAIL}
      CONTRACT_DOMAIN: ${CONTRACT_DOMAIN:-contract.ai-verdict.ru}
      # Без значения по умолчанию: раньше им был порт Guacamole (8080), и
      # .env, собранный из примера, открыл бы рабочий стол хоста на
      # contract.ai-verdict.ru без пароля.
      CONTRACT_AI_UPSTREAM: ${CONTRACT_AI_UPSTREAM:?CONTRACT_AI_UPSTREAM is required}
      # Memory-hub — через порт на хосте, а не по имени контейнера: так ему
      # не нужна общая сеть с базой клиентов и ядром (compose_default).
      MEMORY_HUB_UPSTREAM: ${MEMORY_HUB_UPSTREAM:-host.docker.internal:8787}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      web:
        condition: service_healthy
      core-api:
        condition: service_healthy
    mem_limit: 128m
    memswap_limit: 128m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  postgres_data:
  web_data:
  caddy_data:
  caddy_config:
  lead_bot_data:
  lead_bot_logs:
