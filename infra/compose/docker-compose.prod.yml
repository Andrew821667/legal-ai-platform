x-telegram-api-extra-hosts: &telegram-api-extra-hosts
  - "api.telegram.org:${TELEGRAM_API_HOST_IP:-149.154.167.220}"

# Same as above + host.docker.internal — for services that also need to
# reach the host's HTTP proxy (e.g. news-telegram-ingest using the public
# t.me web preview via the Mac Mini's Happ Plus xray proxy on port 10808).
x-telegram-api-and-host-extra-hosts: &telegram-api-and-host-extra-hosts
  - "api.telegram.org:${TELEGRAM_API_HOST_IP:-149.154.167.220}"
  - "host.docker.internal:host-gateway"


# Секреты, которые сервису не нужны, гасятся пустыми значениями поверх env_file:
# весь .env по-прежнему общий, но утечка из одного контейнера (веб, бот новостей)
# не отдаёт ключ шифрования ПДн, ключи ИИ или токены чужих ботов. Кому что нужно —
# по чтению переменных в коде; сверку держит apps/core-api/tests/test_compose_secrets.py.
# Новый секрет сервису — убрать его из «off»-блока его группы; новый секрет в .env —
# добавить в «off»-блоки всех групп, которым он не нужен.
